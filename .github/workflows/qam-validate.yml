name: QAM validate

on:
  pull_request:
    paths:
      - 'quickagenticmemory/**'
      - '.github/workflows/qam-*.yml'
      - '.dockerignore'
      - '.gitignore'
  push:
    paths:
      - 'quickagenticmemory/**'
      - '.github/workflows/qam-*.yml'
      - '.dockerignore'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qam-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: quickagenticmemory/package-lock.json

      - name: Set up locked uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.18'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
          working-directory: quickagenticmemory/agents/foundry

      - name: Install infrastructure validation tools
        run: |
          set -Eeuo pipefail
          case "$(uname -m)" in
            x86_64)
              shellcheck_arch='x86_64'
              shellcheck_sha256='8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198'
              ;;
            aarch64 | arm64)
              shellcheck_arch='aarch64'
              shellcheck_sha256='12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588'
              ;;
            *) printf 'Unsupported runner architecture for ShellCheck.\n' >&2; exit 1 ;;
          esac
          shellcheck_archive="${RUNNER_TEMP}/shellcheck-v0.11.0.linux.${shellcheck_arch}.tar.xz"
          curl --fail --location --silent --show-error \
            --output "${shellcheck_archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.${shellcheck_arch}.tar.xz"
          printf '%s  %s\n' "${shellcheck_sha256}" "${shellcheck_archive}" | sha256sum --check
          tar --extract --xz --file "${shellcheck_archive}" --directory "${RUNNER_TEMP}"
          sudo install --mode 0755 \
            "${RUNNER_TEMP}/shellcheck-v0.11.0/shellcheck" \
            /usr/local/bin/shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          printf '%s\n' "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Install and validate Bicep, workflows, shell, and secrets
        run: |
          az bicep install
          QAM_REQUIRE_INFRA_TOOLS=true quickagenticmemory/scripts/validate-infra.sh

      - name: Verify complete workspace
        working-directory: quickagenticmemory
        run: |
          npm ci
          npm run verify
          npm run demo

      - name: Verify Microsoft Foundry agent integration
        working-directory: quickagenticmemory/agents/foundry
        run: |
          uv sync --locked --all-groups
          uv run --frozen pytest
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          bash -n configure-access.sh configure-invoker.sh
          shellcheck -x configure-access.sh configure-invoker.sh

      - name: Require a reproducible clean tracked checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Build deployable MCP image
        run: >-
          docker build
          --file quickagenticmemory/packages/mcp/Dockerfile
          --tag qam-mcp:${{ github.sha }}
          .
